<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Pelaporan BOS TK (Offline) - TK Islam Bidayatul Hidayah</title>
<style>
:root{--hijau:#0d6e4f;--hijau2:#0a5a40;--emas:#b8860b;--bg:#f4f6f5;--card:#fff;--teks:#1c2420;--abu:#6b7671;--garis:#d8dedb;--merah:#b3261e;--kuning:#fff8e1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--teks);font-size:15px;line-height:1.5}
header{background:var(--hijau);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:13px;opacity:.92}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--garis);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--garis);background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;min-height:44px;cursor:pointer}
nav button.aktif{background:var(--hijau);color:#fff;border-color:var(--hijau)}
main{max-width:1080px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--garis);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}
h3{margin:16px 0 8px;font-size:16px}
p.catatan{background:var(--kuning);border:1px solid #f0d98c;border-radius:8px;padding:10px 12px}
p.info{background:#eef4ff;border:1px solid #c2d4f5;border-radius:8px;padding:10px 12px}
label{display:block;font-size:13px;color:var(--abu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--garis);border-radius:8px;font-size:15px;min-height:44px;background:#fff;color:var(--teks)}
textarea{min-height:90px}
button.tombol{background:var(--hijau);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;min-height:44px;cursor:pointer}
button.tombol2{background:#fff;color:var(--hijau);border:1px solid var(--hijau);border-radius:8px;padding:10px 14px;font-size:14px;min-height:44px;cursor:pointer}
button.bahaya{background:#fff;color:var(--merah);border:1px solid var(--merah);border-radius:8px;padding:10px 14px;font-size:14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--garis);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#eaf3ee}
td.angka,th.angka{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;background:#eaf3ee}
.baris{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.baris>div{flex:1 1 160px}
.kecil{font-size:13px;color:var(--abu)}
.lencana{display:inline-block;background:#eaf3ee;border:1px solid #bcd8c8;border-radius:999px;padding:2px 9px;font-size:12px}
.lencana.belum{background:#fdecea;border-color:#f5c6c2}
.cek{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--garis);border-radius:8px;padding:9px 10px;margin-bottom:7px}
.cek input{width:auto;min-height:0;margin-top:3px;flex:none}
.cek.selesai{background:#f0f8f3}
.foto{max-width:160px;max-height:120px;border:1px solid var(--garis);border-radius:6px}
img.kop{max-width:100%;height:auto}
img.ttd{height:64px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}table{font-size:13px}}
.tabel-scroll{overflow-x:auto}
#printArea{display:none}
@media print{
  body{background:#fff}
  header,nav,main,.noprint{display:none!important}
  #printArea{display:block;color:#000}
}
.kwitansi{border:1.5px solid #000;padding:18px;max-width:760px;margin:0 auto;font-size:14px}
.kwitansi .kop{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.kwitansi table{border:0}
.kwitansi table td,.kwitansi table th{border:0;padding:3px 4px}
.kwitansi .kotak{border:1.5px solid #000;padding:8px 10px;margin:8px 0}
.kwitansi .ttd td{text-align:center;vertical-align:bottom;height:110px}
</style>
</head>

var LS_KEY = "bos-tk-offline-v1";
var DB = loadDB();
var STEP = "panduan";
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function ensureSettings(){
  if(!DB.settings){
    var d = new Date();
    DB.settings = {tahun:d.getFullYear(), bulan:d.getMonth()+1};
    try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
  }
  return DB.settings;
}
function activeYM(){ var s=ensureSettings(); return s.tahun+"-"+("0"+s.bulan).slice(-2); }
function setActiveYearMonth(tahun, bulan){
  var s=ensureSettings(); s.tahun=parseInt(tahun,10); s.bulan=parseInt(bulan,10);
  BKU_FILTER.bulan = activeYM(); ABS_BULAN = activeYM(); save(); render();
}
function jumpToNow(){ var d=new Date(); setActiveYearMonth(d.getFullYear(), d.getMonth()+1); }
var BKU_FILTER = {bulan:"", jenis:""};
var ABS_BULAN = "2025-12";
var LAPORAN_TAHUN = "";
ensureSettings();
BKU_FILTER.bulan = activeYM();
ABS_BULAN = activeYM();
LAPORAN_TAHUN = String(ensureSettings().tahun);
function loadDB(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.transactions) return d; }
  }catch(e){}
  return JSON.parse(JSON.stringify(INITIAL_STATE));
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ alert("Penyimpanan lokal penuh. Hapus sebagian foto (maks 1,5 MB per foto) lalu coba lagi."); }
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString("id-ID"); }
function rp(n){ return "Rp" + fmt(n); }
function parseNum(v){ if(typeof v==="number") return v; var s = String(v||"").replace(/[^0-9\-]/g,""); return s?parseInt(s,10):0; }
function tglIndo(iso){ if(!iso) return ""; var p = String(iso).split("-"); if(p.length<3) return iso; return p[2]+"/"+p[1]+"/"+p[0]; }
function bulanIndo(ym){ var b=["","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]; var p=String(ym).split("-"); return (b[parseInt(p[1],10)]||"")+" "+p[0]; }
var SATUAN=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function terbilang(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n===0) return "nol";
  function bil(x){
    if(x<12) return SATUAN[x];
    if(x<20) return bil(x-10)+" belas";
    if(x<100) return bil(Math.floor(x/10))+" puluh"+(x%10?" "+bil(x%10):"");
    if(x<200) return "seratus"+(x-100?" "+bil(x-100):"");
    if(x<1000) return bil(Math.floor(x/100))+" ratus"+(x%100?" "+bil(x%100):"");
    if(x<2000) return "seribu"+(x-1000?" "+bil(x-1000):"");
    if(x<1000000) return bil(Math.floor(x/1000))+" ribu"+(x%1000?" "+bil(x%1000):"");
    if(x<1000000000) return bil(Math.floor(x/1000000))+" juta"+(x%1000000?" "+bil(x%1000000):"");
    return bil(Math.floor(x/1000000000))+" miliar"+(x%1000000000?" "+bil(x%1000000000):"");
  }
  var s = bil(n);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function nextId(arr){ var m=0; arr.forEach(function(r){ if(r.id>m) m=r.id; }); return m+1; }
function saldoBerjalan(id){
  var s=0;
  var rows = DB.transactions.slice().sort(function(a,b){ return (a.tanggal<b.tanggal?-1:a.tanggal>b.tanggal?1:a.id-b.id); });
  for(var i=0;i<rows.length;i++){ s += (Number(rows[i].penerimaan)||0)-(Number(rows[i].pengeluaran)||0); if(rows[i].id===id) return s; }
  return s;
}
function totalKas(){
  var tunai=0, bank=0;
  DB.transactions.forEach(function(t){
    var netto=(Number(t.penerimaan)||0)-(Number(t.pengeluaran)||0);
    if(t.metode==="Tunai") tunai+=netto; else bank+=netto;
  });
  return {tunai:tunai, bank:bank, total:tunai+bank};
}
function checksFor(txId){ return DB.checks.filter(function(c){ return c.transactionId===txId; }); }
function templateFor(jenis){ return DB.templates[jenis] || DB.templates["Lainnya"] || []; }
function rebuildChecks(tx){
  DB.checks = DB.checks.filter(function(c){ return c.transactionId!==tx.id; });
  templateFor(tx.jenisBelanja).forEach(function(tpl){
    DB.checks.push({id:nextId(DB.checks), transactionId:tx.id, docKey:tpl.key, docLabel:tpl.label, checked:false, note:"", fileName:""});
  });
}
function kopImg(){ return DB.profile.kopDataUrl || KOP_DEFAULT; }

  var prevScroll = [];
  document.querySelectorAll(".tabel-scroll").forEach(function(el){ prevScroll.push(el.scrollLeft); });

function parseImportText(text){
  var lines = text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2) return [];
  var delim = lines[0].indexOf("\t")>=0 ? "\t" : (lines[0].indexOf(";")>=0 && lines[0].indexOf(",")<0 ? ";" : ",");
  function splitLine(l){
    var out=[], cur="", q=false;
    for(var i=0;i<l.length;i++){ var ch=l[i];
      if(ch==='"'){ q=!q; }
      else if(ch===delim && !q){ out.push(cur); cur=""; }
      else cur+=ch;
    }
    out.push(cur); return out.map(function(s){ return s.trim().replace(/^"|"$/g,""); });
  }
  var head = splitLine(lines[0]).map(function(h){ return h.toLowerCase().replace(/[^a-z_]/g,""); });
  var idx = {};
  ["tanggal","uraian","jenis","komponen","metode","penerimaan","pengeluaran","kode_kegiatan","kode_rekening","no_bukti","keterangan_bulan","penyedia"].forEach(function(k){ idx[k]=head.indexOf(k); });
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var c = splitLine(lines[i]);
    var get = function(k){ var j=idx[k]; return j>=0 ? (c[j]||"") : ""; };
    var tanggal = get("tanggal");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(tanggal)){
      var m = tanggal.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if(m) tanggal = m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
    }
    rows.push({tanggal:tanggal, uraian:get("uraian"), jenisBelanja:get("jenis")||"Lainnya", komponen:get("komponen")||DB.rkas[0].komponen, metode:get("metode")||"Tunai", penerimaan:parseNum(get("penerimaan")), pengeluaran:parseNum(get("pengeluaran")), kodeKegiatan:get("kode_kegiatan"), kodeRekening:get("kode_rekening"), noBukti:get("no_bukti"), keteranganBulan:get("keterangan_bulan"), penyedia:get("penyedia"), penerima:"", penerimaJabatan:"", penerimaAlamat:"", pajakPpn:0, pajakPph:0});
  }
  return rows.filter(function(r){ return r.tanggal && r.uraian; });
}

        +'<label style="margin:4px 0 0">Nama berkas<input value="'+esc(c.fileName||"")+'" onchange="setSpjFile('+c.id+',this.value)"></label></div></div>';
    }).join("");
    var fotoHtml = photos.map(function(p){

    }).join("");
    return '<div class="card"><h3>'+tglIndo(t.tanggal)+' &middot; '+esc(t.uraian)+'</h3>'
      +'<p class="kecil">'+esc(t.jenisBelanja)+' &middot; '+rp(Number(t.pengeluaran)||Number(t.penerimaan)||0)+' &middot; SPJ '+done+'/'+cs.length+' selesai</p>'

      +(t.jenisBelanja==="Belanja SIPLah"?'<p class="catatan">Belanja SIPLah sudah diberi 6 dokumen sesuai dari SIPLah.</p>':"")

      +'</div>';
  }).join("");
  return '<div class="card"><h2>3. SPJ (Surat Pertanggungjawaban)</h2><p>Centang dokumen yang sudah ada berkasnya. Isi catatan lokasi berkas bila perlu, boleh dikosongkan.</p></div>' + blocks;
}

function uploadTxPhoto(ev, txId){

function cycleAtt(teacherId, tanggal, btn){
  var order = ["", "H", "I", "S", "A"];
  var cur = attGet(teacherId, tanggal);
  var nx = order[(order.indexOf(cur)+1)%order.length];
  var r = DB.attendance.find(function(a){return a.teacherId===teacherId && a.tanggal===tanggal;});
  if(nx===""){ if(r) DB.attendance = DB.attendance.filter(function(a){return a!==r;}); }
  else if(r) r.status = nx;
  else DB.attendance.push({teacherId:teacherId, tanggal:tanggal, status:nx});
  save();
  if(btn) btn.textContent = nx || "-";
}
function markAllPresent(){
  var ym = ABS_BULAN, n = daysInMonth(ym);
  DB.teachers.forEach(function(t){
    for(var d=1; d<=n; d++){
      var iso = ym+"-"+("0"+d).slice(-2);
      var dow = new Date(iso+"T00:00:00").getDay();
      if(dow===0 || dayOffGet(iso)) continue;
      if(!attGet(t.id, iso)) DB.attendance.push({teacherId:t.id, tanggal:iso, status:"H"});
    }
  });
  save(); render();
}
function clearMonthAtt(){
  if(!confirm("Hapus semua tanda hadir bulan ini?")) return;
  DB.attendance = DB.attendance.filter(function(a){ return a.tanggal.slice(0,7)!==ABS_BULAN; });
  save(); render();
}
function addDayOff(){
  var d = document.getElementById("off_date").value;
  var l = document.getElementById("off_label").value.trim() || "LIBUR";
  if(!d){ alert("Pilih tanggal libur."); return; }
  var ex = dayOffGet(d);
  if(ex) ex.label = l; else DB.dayOffs.push({tanggal:d, label:l});
  save(); render();
}
function removeDayOff(tanggal){ DB.dayOffs = DB.dayOffs.filter(function(o){return o.tanggal!==tanggal;}); save(); render(); }
function addTeacher(){
  var nama = prompt("Nama guru/tendik:");
  if(!nama) return;
  var jab = prompt("Jabatan:", "Guru Tetap Yayasan") || "";
  DB.teachers.push({id:nextId(DB.teachers), nama:nama.trim(), jabatan:jab, nuptk:"", urutan:DB.teachers.length});
  save(); render();
}
function editTeacher(id){
  var t = DB.teachers.find(function(x){return x.id===id;}); if(!t) return;
  var nama = prompt("Nama:", t.nama); if(nama==null) return;
  var jab = prompt("Jabatan:", t.jabatan); if(jab==null) return;
  t.nama = nama.trim(); t.jabatan = jab; save(); render();
}
function deleteTeacher(id){
  if(!confirm("Hapus guru ini beserta seluruh tanda kehadirannya?")) return;
  DB.teachers = DB.teachers.filter(function(x){return x.id!==id;});
  DB.attendance = DB.attendance.filter(function(a){return a.teacherId!==id;});
  save(); render();
}

}
function printBKU(){
  var rows = DB.transactions.slice().sort(function(a,b){ return (a.tanggal<b.tanggal?-1:a.tanggal>b.tanggal?1:a.id-b.id); });
  var s=0;
  var body = rows.map(function(t){
    s += (Number(t.penerimaan)||0)-(Number(t.pengeluaran)||0);
    return "<tr><td>"+tglIndo(t.tanggal)+"</td><td>"+esc(t.uraian)+"</td><td>"+esc(t.kodeKegiatan||"")+"</td><td>"+esc(t.kodeRekening||"")+"</td><td>"+esc(t.noBukti||"")+"</td><td style='text-align:right'>"+(t.penerimaan?fmt(t.penerimaan):"")+"</td><td style='text-align:right'>"+(t.pengeluaran?fmt(t.pengeluaran):"")+"</td><td style='text-align:right'>"+fmt(s)+"</td></tr>";
  }).join("");
  var p = DB.profile;
  document.getElementById("printArea").innerHTML = '<div style="text-align:center"><img src="'+kopImg()+'" style="max-width:100%"><br><b>BUKU KAS UMUM (BKU)</b><br>'+esc(p.namaSekolah)+' &middot; NPSN '+esc(p.npsn)+'<br>Tahun Anggaran '+esc(p.tahunAnggaran)+'</div><br><table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:12px"><tr><th>Tanggal</th><th>Uraian</th><th>Kode Kegiatan</th><th>Kode Rekening</th><th>No Bukti</th><th>Penerimaan</th><th>Pengeluaran</th><th>Saldo</th></tr>'+body+'</table><br><table style="width:100%;font-size:13px"><tr><td style="text-align:center">Mengetahui,<br>Kepala Sekolah<br><br><br><b>'+esc(p.kepalaSekolah)+'</b></td><td style="text-align:center">Bendahara<br><br><br><br><b>'+esc(p.bendahara)+'</b></td></tr></table>';
  window.print();
}
function printRekap(){
  document.getElementById("printArea").innerHTML = document.querySelector("main").innerHTML;
  window.print();
}
function printKwitansi(txId){
  var t = DB.transactions.find(function(x){return x.id===txId;}); if(!t) return;
  var p = DB.profile;
  var jumlah = Number(t.pengeluaran)||Number(t.penerimaan)||0;
  var judul = Number(t.pengeluaran)>0 ? "KWITANSI" : "BUKTI PENERIMAAN";
  var kata = Number(t.pengeluaran)>0 ? "TELAH TERIMA DARI BENDAHARA DANA BOP" : "TELAH DITERIMA DARI";
  var ttdK = p.ttdKepalaDataUrl ? '<img class="ttd" src="'+p.ttdKepalaDataUrl+'"><br>' : "<br><br><br>";
  var ttdB = p.ttdBendaharaDataUrl ? '<img class="ttd" src="'+p.ttdBendaharaDataUrl+'"><br>' : "<br><br><br>";
  document.getElementById("printArea").innerHTML =
    '<div class="kwitansi"><div class="kop"><img src="'+kopImg()+'" style="max-width:100%"></div>'
    +'<div style="text-align:center"><b>'+judul+'</b></div>'
    +'<table><tr><td>KODE KEGIATAN</td><td>: '+esc(t.kodeKegiatan||"-")+'</td></tr>'
    +'<tr><td>KODE REKENING</td><td>: '+esc(t.kodeRekening||"-")+'</td></tr>'
    +'<tr><td>NOMOR BUKTI</td><td>: '+esc(t.noBukti||"-")+'</td></tr></table>'
    +'<p>'+kata+'<br>Uang sebesar <b>'+rp(jumlah)+'</b></p>'
    +'<div class="kotak"><i>'+terbilang(jumlah)+' rupiah</i></div>'
    +'<p>Untuk pembayaran: '+esc(t.uraian)+(t.keteranganBulan?" ("+esc(t.keteranganBulan)+")":"")+'</p>'
    +'<p style="text-align:right">Mataram, '+tglIndo(t.tanggal)+'</p>'
    +'<table class="ttd" style="width:100%"><tr>'
    +'<td>SETUJU DIBAYAR<br>Kepala Sekolah<br>'+ttdK+'<b><u>'+esc(p.kepalaSekolah)+'</u></b></td>'
    +'<td>LUNAS DIBAYAR<br>Bendahara<br>'+ttdB+'<b><u>'+esc(p.bendahara)+'</u></b></td>'
    +'<td>YANG MENERIMA UANG<br><br><br><br><b><u>'+esc(t.penyedia||t.penerima||"(nama penerima)")+'</u></b></td>'
    +'</tr></table></div>';
  window.print();
}
function exportData(){
  var blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cadangan-bos-tk.json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importDataFile(ev){
  var f = ev.target.files && ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d || !d.transactions || !d.profile) throw new Error("format");
      DB = d; save(); render();
      alert("Data cadangan berhasil dimuat.");
    }catch(e){ alert("File cadangan tidak valid."); }
  };
  rd.readAsText(f);
}
function resetData(){
  if(!confirm("Kembalikan data awal 2025? Semua perubahan akan hilang.")) return;
  DB = JSON.parse(JSON.stringify(INITIAL_STATE));
  save(); render();
}
if(DB.migratedTtd !== 2){
  (INITIAL_STATE.teachers||[]).forEach(function(st){
    var t = DB.teachers.find(function(x){return x.id===st.id;});
    if(t && st.ttd && !t.ttd) t.ttd = st.ttd;
  });
  if(INITIAL_STATE.profile && INITIAL_STATE.profile.ttdKepalaDataUrl && !DB.profile.ttdKepalaDataUrl) DB.profile.ttdKepalaDataUrl = INITIAL_STATE.profile.ttdKepalaDataUrl;
  DB.migratedTtd = 2; save();
}
render();
</script>
